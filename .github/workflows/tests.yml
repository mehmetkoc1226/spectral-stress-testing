name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q
      - name: Install saved-result verification dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Verify saved results and additional numerical controls
        run: python tools/verify_reproducibility.py --skip-pytest
